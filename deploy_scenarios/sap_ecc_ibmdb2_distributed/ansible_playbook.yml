---
# Ansible Playbook for SAP ECC with IBM Db2 Standard installation

# Use include_role / include_tasks inside Ansible Task block, instead of using roles declaration or Task block with import_roles.
# This ensures Ansible Roles, and the tasks within, will be parsed in sequence instead of parsing at Playbook initialization.


#### Interactive Mode ####
# Interactive mode section can be safely removed without impact if all mandatory variables are provided.
- name: Ansible Play to Interactively gather all mandatory variables
  hosts: localhost
  gather_facts: false
  pre_tasks:

    - name: Block for collection for interactive prompts
      when:
        - sap_playbook_interactive_product is defined and sap_playbook_interactive_product | length > 0
        - sap_playbook_interactive_database is defined and sap_playbook_interactive_database | length > 0
        - sap_playbook_interactive_layout is defined and sap_playbook_interactive_layout | length > 0
      block:
        - name: Check if interactive tasks are available
          ansible.builtin.stat:
            path: ../../common_fragments/tasks/interactive/main.yml
          register: __sap_playbook_register_interactive_tasks_availability
          ignore_errors: true

        - name: Execute collection of interactive inputs
          ansible.builtin.include_tasks:
            file: ../../common_fragments/tasks/interactive/main.yml
          when: __sap_playbook_register_interactive_tasks_availability.stat.exists


- name: Ansible Play to validate the variables
  hosts: localhost
  # gather_facts is required for loop over hostvars
  tasks:

    - name: Assert that the variable 'sap_vm_provision_iac_type' is valid
      ansible.builtin.assert:
        that:
          - sap_vm_provision_iac_type is defined
          - sap_vm_provision_iac_type in ['ansible', 'ansible_to_terraform', 'existing_hosts']
        fail_msg: |
          The variable 'sap_vm_provision_iac_type' is undefined or invalid.
          Available options: ansible, ansible_to_terraform, existing_hosts

    - name: Assert that the variable 'sap_vm_provision_iac_platform' is valid
      ansible.builtin.assert:
        that:
          - sap_vm_provision_iac_platform is defined
          - sap_vm_provision_iac_platform in
            ['aws_ec2_vs', 'gcp_ce_vm', 'msazure_vm', 'ibmcloud_powervs', 'ibmcloud_vs',
              'ibmpowervm_vm', 'kubevirt_vm', 'ovirt_vm', 'vmware_vm', 'existing_hosts']
        fail_msg: |
          The variable 'sap_vm_provision_iac_platform' is undefined or invalid.
          Available options: aws_ec2_vs, gcp_ce_vm, msazure_vm, ibmcloud_powervs, ibmcloud_vs, ibmpowervm_vm, kubevirt_vm, ovirt_vm, vmware_vm, existing_hosts

    # Ignore registered vars and sap_swpm hostnames which could contain hostvars.
    - name: Prepare list of SAP variables for validation  # noqa: ignore-errors
      ansible.builtin.set_fact:
        __sap_playbook_fact_dictionary_vars:
          "{{ dict(__sap_playbook_fact_dictionary_vars | zip(lookup('ansible.builtin.vars', *__sap_playbook_fact_dictionary_vars))) }}"
      vars:
        __sap_playbook_fact_dictionary_vars:
          "{{ lookup('ansible.builtin.varnames', '^(__)?sap_', wantlist=true)
              | reject('search', '(^(__)?sap_swpm_.*_hostname$)|(.*_register$)')
              | reject('in', ['sap_swpm_db_host'])
              | list }}"
      no_log: true
      ignore_errors: true

    - name: Identify variables with placeholder values or empty passwords  # noqa: ignore-errors
      ansible.builtin.set_fact:
        __sap_playbook_fact_placeholder_vars:
          "{{ __sap_playbook_fact_dictionary_vars | dict2items
              | selectattr('value', 'equalto', 'ENTER_STRING_VALUE_HERE') | map(attribute='key') | list }}"

        __sap_playbook_fact_empty_password_vars:
          "{{ __sap_playbook_fact_dictionary_vars | dict2items | selectattr('key', 'search', 'password')
              | selectattr('value', 'in', [none, '']) | map(attribute='key') | list }}"
      no_log: true
      ignore_errors: true

    - name: Report SAP variable validation failures
      ansible.builtin.fail:
        msg: |
          Please address the following issues before re-running the playbook:
          {% if __sap_playbook_fact_placeholder_vars | length > 0 %}
          - Placeholder values found for variable(s):
            {% for item in __sap_playbook_fact_placeholder_vars %}
            {{ item }}
            {% endfor %}

          {% endif %}
          {% if __sap_playbook_fact_empty_password_vars | length > 0 %}
          - Empty or invalid values found for password variable(s):
            {% for item in __sap_playbook_fact_empty_password_vars %}
            {{ item }}
            {% endfor %}
          {% endif %}
      when:
        - __sap_playbook_fact_placeholder_vars | d([]) | length > 0 or __sap_playbook_fact_empty_password_vars | d([]) | length > 0


#### Begin Infrastructure-as-Code provisioning ####
- name: Ansible Play to create dynamic inventory group for provisioning
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Block to prepare inventory for provisioning
      when:
        - sap_vm_provision_iac_type in ['ansible', 'ansible_to_terraform']
        - sap_vm_provision_iac_platform != 'existing_hosts'
      vars:
        __sap_playbook_host_dictionary_name: "{{ 'sap_vm_provision_' ~ sap_vm_provision_iac_platform ~ '_host_specifications_dictionary' }}"
      block:
        - name: Assert that the variable {{ __sap_playbook_host_dictionary_name }} is defined and valid
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.vars', __sap_playbook_host_dictionary_name) is defined
              - lookup('ansible.builtin.vars', __sap_playbook_host_dictionary_name) is mapping
              - lookup('ansible.builtin.vars', __sap_playbook_host_dictionary_name) | length > 0
            fail_msg: |
              The variable {{ __sap_playbook_host_dictionary_name }} is undefined or invalid.
              It must be a non-empty dictionary.

        - name: Assert that the variable 'sap_vm_provision_host_specification_plan' is defined and valid
          ansible.builtin.assert:
            that:
              - sap_vm_provision_host_specification_plan is defined
              - sap_vm_provision_host_specification_plan is string
              - sap_vm_provision_host_specification_plan | trim | length > 0
            fail_msg: |
              The variable 'sap_vm_provision_host_specification_plan' is undefined or invalid.
              It must be a non-empty string.

        - name: Assert that the variable 'sap_vm_provision_host_specification_plan' is present in a dictionary
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.vars', __sap_playbook_host_dictionary_name)[sap_vm_provision_host_specification_plan] is defined
              - lookup('ansible.builtin.vars', __sap_playbook_host_dictionary_name)[sap_vm_provision_host_specification_plan] is mapping
              - lookup('ansible.builtin.vars', __sap_playbook_host_dictionary_name)[sap_vm_provision_host_specification_plan] | length > 0
            fail_msg: |
              The variable 'sap_vm_provision_host_specification_plan' is not present in a dictionary {{ __sap_playbook_host_dictionary_name }}.

        - name: Create dynamic inventory group for Ansible Role sap_vm_provision
          ansible.builtin.add_host:
            name: "{{ host_item }}"
            group: sap_vm_provision_target_inventory_group
          loop: "{{ lookup('ansible.builtin.vars', __sap_playbook_host_dictionary_name)[sap_vm_provision_host_specification_plan].keys() }}"
          loop_control:
            loop_var: host_item


# Ansible Play target hosts pattern, use Inventory Group created by previous Ansible Task (add_host)
- name: Ansible Play to provision hosts for SAP
  hosts: sap_vm_provision_target_inventory_group
  gather_facts: false
  tasks:

    # Ensure that all sap_* or __sap_* variables set in Interactive Mode are appended to the target inventory Group
    - name: Assign all relevant facts from execution node before provisioning  # noqa: ignore-errors
      ansible.builtin.set_fact:
        "{{ var_item.key }}": "{{ var_item.value }}"
        cacheable: true
      loop: "{{ hostvars['localhost'] | dict2items | selectattr('key', 'match', '^(__)?sap_') | list }}"
      loop_control:
        loop_var: var_item
      when:
        - sap_playbook_interactive_product is defined and sap_playbook_interactive_product | length > 0
        - sap_playbook_interactive_database is defined and sap_playbook_interactive_database | length > 0
        - sap_playbook_interactive_layout is defined and sap_playbook_interactive_layout | length > 0
        - vars[var_item.key] is undefined
      no_log: true
      ignore_errors: true  # Ignore errors for variables defined later during runtime

    - name: Execute Ansible Role sap_vm_provision
      ansible.builtin.include_role:
        name: community.sap_infrastructure.sap_vm_provision
      when:
        - sap_vm_provision_iac_type in ['ansible', 'ansible_to_terraform']
        - sap_vm_provision_iac_platform != 'existing_hosts'

- name: Ansible Play to set sap variables on provisioned hosts
  hosts: sap_vm_provision_target_inventory_group  # noqa: ignore-errors
  gather_facts: false
  tasks:

    - name: Assign all relevant facts from execution node after provisioning  # noqa: ignore-errors
      ansible.builtin.set_fact:
        "{{ var_item.key }}": "{{ var_item.value }}"
        cacheable: true
      loop: "{{ hostvars['localhost'] | dict2items | selectattr('key', 'match', '^(__)?sap_') | list }}"
      loop_control:
        loop_var: var_item
      when:
        - sap_playbook_interactive_product is defined and sap_playbook_interactive_product | length > 0
        - sap_playbook_interactive_database is defined and sap_playbook_interactive_database | length > 0
        - sap_playbook_interactive_layout is defined and sap_playbook_interactive_layout | length > 0
        - vars[var_item.key] is undefined
      no_log: true
      ignore_errors: true  # Ignore errors for variables defined later during runtime


#### VM storage filesystem setup ####
- name: Ansible Play for hosts storage setup
  hosts: anydb_primary, nwas_ascs, nwas_pas, nwas_aas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    # Use inventory_hostname_short to retrieve host specification from the dictionary.
    # While ansible_facts['hostname'] will work for Ansible only, using Ansible>Terraform may see ansible_facts['hostname'] as 'localhost' and fail
    - name: Execute Ansible Role sap_storage_setup
      ansible.builtin.include_role:
        name: community.sap_install.sap_storage_setup
      vars:
        sap_playbook_host_dictionary_hostname:
          "{{ lookup('ansible.builtin.vars', 'sap_vm_provision_' + sap_vm_provision_iac_platform
           + '_host_specifications_dictionary')[sap_vm_provision_host_specification_plan][inventory_hostname_short] }}"
        sap_storage_setup_sid: "{{ sap_playbook_host_dictionary_hostname.get('sap_storage_setup_sid', (sap_system_sid | d(''))) }}"
        sap_storage_setup_nwas_abap_ascs_instance_nr:
          "{{ sap_playbook_host_dictionary_hostname.get('sap_storage_setup_nwas_abap_ascs_instance_nr', (sap_system_nwas_abap_ascs_instance_nr | d(''))) }}"
        sap_storage_setup_nwas_abap_pas_instance_nr:
          "{{ sap_playbook_host_dictionary_hostname.get('sap_storage_setup_nwas_abap_pas_instance_nr', (sap_system_nwas_abap_pas_instance_nr | d(''))) }}"
        sap_storage_setup_nwas_abap_aas_instance_nr:
          "{{ sap_playbook_host_dictionary_hostname.get('sap_storage_setup_nwas_abap_aas_instance_nr', (sap_system_nwas_abap_aas_instance_nr | d(''))) }}"
        sap_storage_setup_host_type: "{{ sap_playbook_host_dictionary_hostname.get('sap_storage_setup_host_type', []) }}"
      when: sap_playbook_host_dictionary_hostname is defined


- name: Ansible Play for ensuring rsync on all hosts
  hosts: anydb_primary, nwas_ascs, nwas_pas, nwas_aas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Execute Ansible Role sap_maintain_etc_hosts for existing_hosts  # noqa: no-tabs
      ansible.builtin.import_role:
        name: community.sap_install.sap_maintain_etc_hosts
      vars:
        sap_maintain_etc_hosts_delimiter: "\t"
        sap_maintain_etc_hosts_domain: "{{ sap_domain }}"
        sap_maintain_etc_hosts_list: >-
          {%- set my_list = [] -%}
          {%- for host in ansible_play_hosts_all -%}
            {%- if hostvars[host] is defined and hostvars[host]['ansible_host'] is defined -%}
              {%- set _ = my_list.append({'node_name': host, 'node_ip': hostvars[host]['ansible_host']}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ my_list }}
      when:
        - sap_vm_provision_iac_platform == 'existing_hosts'
        - sap_domain | d('') | length > 0 or ansible_facts['domain'] | d('') | length > 0

    - name: Install rsync
      ansible.builtin.package:
        name: rsync
        state: present


#### Begin downloading SAP software installation media to hosts ####
- name: Ansible Play for downloading installation media
  hosts: nwas_pas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    # SAP software download will only occur if the 'community.sap_launchpad' collection is installed.
    # Playbook will continue without the collection, assuming SAP software is already available.
    - name: Check availability of sap_launchpad collection on execution node
      delegate_to: localhost
      become: false  # Enables usage of Python VENV
      ansible.builtin.command:
        cmd: ansible-galaxy collection list
      register: __sap_playbook_register_collection_list_output
      changed_when: false

    - name: Execute Ansible Role sap_software_download
      ansible.builtin.include_role:
        name: community.sap_launchpad.sap_software_download
      vars:
        sap_software_download_suser_id: "{{ sap_id_user }}"
        sap_software_download_suser_password: "{{ sap_id_user_password }}"
        sap_software_download_directory: "{{ sap_install_media_detect_source_directory }}"
        sap_software_download_deduplicate: last
        # Enables broader search for known files, not just the bugfix versions.
        # Example: Helps with downloading higher HANA revision version within same SPS level.
        sap_software_download_find_upgrades: true
        sap_software_download_upgrade_relationships: true
        sap_software_download_files: "{{ (
          sap_software_install_dictionary[sap_software_product]['sap_software_list_' ~ ansible_facts['architecture']] | d([]) +
          sap_software_install_dictionary[sap_software_product]['sap_software_list_independent'] | d([])) | unique }}"
      when: __sap_playbook_register_collection_list_output.stdout_lines | select('search', 'community.sap_launchpad') | length > 0


    - name: Find SAP NetWeaver ASCS installation media
      ansible.builtin.find:
        paths:
          - "{{ sap_install_media_detect_source_directory }}"
        patterns: "{{ sap_software_install_dictionary[sap_software_product]['nwas_ascs']['sap_software_files_wildcard_list'] }}"
        recurse: true
      register: __sap_playbook_register_sap_nwas_ascs_install_media_files

    - name: Find SAP NetWeaver AAS installation media
      ansible.builtin.find:
        paths:
          - "{{ sap_install_media_detect_source_directory }}"
        patterns: "{{ sap_software_install_dictionary[sap_software_product]['nwas_aas']['sap_software_files_wildcard_list'] }}"
        recurse: true
      register: __sap_playbook_register_sap_nwas_aas_install_media_files

    - name: Prepare for file transfers, copy Private SSH Key from local
      ansible.builtin.copy:
        src: "{{ sap_vm_provision_ssh_host_private_key_file_path
          if sap_vm_provision_ssh_host_private_key_file_path is defined
          else sap_vm_provision_terraform_work_dir_path ~ '/ssh/hosts_rsa' }}"
        dest: "/tmp/hosts_rsa"
        mode: "0400"


- name: Ansible Play for copying installation media to AnyDB Database Instance Primary
  hosts: anydb_primary
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Transfer all installation media to AnyDB Database Instance Primary
      delegate_to: "{{ software_source_ip if sap_vm_provision_iac_platform != 'existing_hosts' else software_source_hostname }}"
      remote_user: "root"
      ansible.posix.synchronize:
        src: "{{ sap_install_media_detect_source_directory }}/" # trailing slash to copy items in the directory, not the directory itself
        dest: "{{ sap_install_media_detect_source_directory | trim | regex_replace('//', '/') | regex_replace(' ', '') | regex_replace('\\/+$', '') + '/' }}"
        mode: "push"
        dest_port: 22
        use_ssh_args: false
        verify_host: false
        private_key: "/tmp/hosts_rsa"
        # set_remote_user: false
      vars:
        software_source_hostname: "{{ hostvars[inventory_hostname].groups.nwas_pas[0] | d(none) }}"
        software_source_ip: "{{ hostvars[software_source_hostname].ansible_host | d(none) }}"


- name: Ansible Play for copying SAP NetWeaver ASCS installation media to host
  hosts: nwas_ascs
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Transfer SAP NetWeaver ASCS installation media to host
      delegate_to: "{{ software_source_ip if sap_vm_provision_iac_platform != 'existing_hosts' else software_source_hostname }}"
      remote_user: "root"
      ansible.posix.synchronize:
        src: "{{ file_item }}"
        dest: "{{ sap_install_media_detect_source_directory | trim | regex_replace('//', '/') | regex_replace(' ', '') | regex_replace('\\/+$', '') + '/' }}"
        mode: "push"
        dest_port: 22
        use_ssh_args: false
        verify_host: false
        private_key: "/tmp/hosts_rsa"
        # set_remote_user: false
      loop: "{{ hostvars[software_source_hostname].__sap_playbook_register_sap_nwas_ascs_install_media_files.files | map(attribute='path') | list }}"
      loop_control:
        loop_var: file_item
      vars:
        software_source_hostname: "{{ hostvars[inventory_hostname].groups.nwas_pas[0] | d(none) }}"
        software_source_ip: "{{ hostvars[software_source_hostname].ansible_host | d(none) }}"


- name: Ansible Play for copying SAP NetWeaver AAS installation media to host
  hosts: nwas_aas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Transfer SAP NetWeaver AAS installation media to host
      delegate_to: "{{ software_source_ip if sap_vm_provision_iac_platform != 'existing_hosts' else software_source_hostname }}"
      remote_user: "root"
      ansible.posix.synchronize:
        src: "{{ file_item }}"
        dest: "{{ sap_install_media_detect_source_directory | trim | regex_replace('//', '/') | regex_replace(' ', '') | regex_replace('\\/+$', '') + '/' }}"
        mode: "push"
        dest_port: 22
        use_ssh_args: false
        verify_host: false
        private_key: "/tmp/hosts_rsa"
        # set_remote_user: false
      loop: "{{ hostvars[software_source_hostname].__sap_playbook_register_sap_nwas_aas_install_media_files.files | map(attribute='path') | list }}"
      loop_control:
        loop_var: file_item
      vars:
        software_source_hostname: "{{ hostvars[inventory_hostname].groups.nwas_pas[0] | d(none) }}"
        software_source_ip: "{{ hostvars[software_source_hostname].ansible_host | d(none) }}"


- name: Ansible Play to remove temporary files from SAP NetWeaver PAS
  hosts: nwas_pas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Remove temporary file, if it exists
      ansible.builtin.file:
        path: "/tmp/hosts_rsa"
        state: absent


#### Begin SAP software hosts preparation ####
- name: Ansible Play for preparing all SAP software hosts
  hosts: anydb_primary, nwas_ascs, nwas_pas, nwas_aas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Execute Ansible Role sap_general_preconfigure
      ansible.builtin.include_role:
        name: community.sap_install.sap_general_preconfigure


- name: Ansible Play for preparing all SAP NetWeaver hosts
  hosts: nwas_ascs, nwas_pas, nwas_aas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:
    - name: Execute Ansible Role sap_netweaver_preconfigure
      ansible.builtin.include_role:
        name: community.sap_install.sap_netweaver_preconfigure


- name: Ansible Play for operating system prerequisites for IBM Db2 Database Server
  hosts: anydb_primary
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Block for SUSE
      when: ansible_facts['os_family'] == 'Suse'
      block:
        - name: Register SUSEConnect modules for DB2 (SLES 15)
          ansible.builtin.command:
            cmd: "SUSEConnect -p {{ module_item }}/{{ ansible_facts['distribution_version'] }}/x86_64"
          loop:
            - sle-module-legacy
            - sle-module-development-tools
          loop_control:
            loop_var: module_item
          when: ansible_facts['distribution_major_version'] == "15"
          changed_when: true  # SUSEConnect does not differentiate already activated modules.

        # Legacy packages are not present on SLES 16.
        - name: Install required packages for IBM DB2 LUW - SUSE
          ansible.builtin.package:
            name:
              "{{ base_packages
                + (legacy_packages if ansible_facts['distribution_major_version'] == '15' else []) }}"
            state: present
          vars:
            base_packages:
              - ksh
              - mksh
              - pam-devel
              - libstdc++6
              - libaio1
              - system-user-bin
              - binutils
            legacy_packages:
              - pam-devel-32bit  # Part of sle-module-development-tools
              - net-tools-deprecated  # Part of sle-module-legacy
              - libstdc++6-32bit

        - name: Remove Port 5912 from {{ __etc_services_path }} for default IBM DB2 service and client communications (set as 'fis' by IANA) - SUSE
          ansible.builtin.lineinfile:
            path: "{{ __etc_services_path }}"
            regexp: ".*Flight Information Services.*"
            state: absent
          vars:
            __etc_services_path:
              "{{ '/usr/etc/services' if ansible_facts['distribution_major_version'] == '16' else '/etc/services' }}"


    - name: Block for Red Hat
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Install required packages for IBM DB2 LUW - Red Hat
          ansible.builtin.package:
            name:
              - ksh
              - mksh
              - pam-devel
              - libstdc++
              - libaio
            state: present

        - name: Remove Port 5912 from /etc/services for default IBM DB2 service and client communications (set as 'fis' by IANA) - Red Hat
          ansible.builtin.lineinfile:
            path: /etc/services
            regexp: ".*Flight Information Services.*"
            state: absent


#### Begin SAP software installations ####
- name: Ansible Play for SAP NetWeaver Application Server installation - ABAP Central Services (ASCS)
  hosts: nwas_ascs
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Execute Ansible Role sap_install_media_detect
      ansible.builtin.include_role:
        name: community.sap_install.sap_install_media_detect
      vars:
        sap_install_media_detect_swpm: true
        sap_install_media_detect_hostagent: true
        sap_install_media_detect_igs: true
        sap_install_media_detect_kernel: true
        sap_install_media_detect_webdisp: false

    - name: Execute Ansible Role sap_swpm
      ansible.builtin.include_role:
        name: community.sap_install.sap_swpm
      vars:
        sap_swpm_templates_product_input: "nwas_ascs"


- name: Ansible Play for IBM Db2 Database Server installation and SAP ECC Installation Export Database Load
  hosts: anydb_primary
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    # SAFETY CHECK: SWPM Database Load Detection (DB2)
    # Pure DB Load products (e.g. NW_ABAP_DB) create no local instance files,
    # preventing the 'sap_swpm' role from detecting existing installations.
    # Running SWPM against an existing DB WILL DROP the schema user (DATA LOSS).
    #
    # We search /db2 for any SAP files, not just empty directories, to ensure the DB Load is not re-run.
    # - First run: No files are found and 'sap_swpm_db_load_force' is set to 'true'.
    #
    # - Re-run: Any files are present -> 'sap_swpm_db_load_force' is set to 'false',
    #   causing 'sap_swpm' to fail immediately and protect the database.

    # Depth of 8 finds files that are not hidden, while hidden 'true' finds files start with a dot in the name.
    # NOTE: Depth of 8 on ECC can still find over 17 thousand files, taking approximately 8 seconds to complete.
    # Examples with hidden files starting at depth 4, while depth 7 finds regular files.
    # /db2/DB2/sapdata4/db2db2/.SQLCRT.FLG
    # /db2/DB2/sapdata4/db2db2/NODE0000/.SQLCRT.FLG
    # /db2/DB2/sapdata4/db2db2/NODE0000/DB2/.SQLCRT.FLG
    # /db2/DB2/sapdata4/db2db2/NODE0000/DB2/T0000000/.SQLCRT.FLG
    # /db2/DB2/sapdata4/db2db2/NODE0000/DB2/T0000000/C0000003.CAT
    - name: Check if DB2 instance or database exists in /db2
      ansible.builtin.find:
        paths: "/db2"
        file_type: file
        recurse: true
        hidden: true
        depth: 8
      register: __sap_playbook_register_db2_files_find

    # NOTE: This task could be skipped if files are found,
    # but 'sap_swpm' variables would need to be exposed in extravars files (e.g. 'sap_swpm_cd_ibmdb2_path').
    - name: Execute Ansible Role sap_install_media_detect
      ansible.builtin.include_role:
        name: community.sap_install.sap_install_media_detect
      vars:
        sap_install_media_detect_swpm: true
        sap_install_media_detect_hostagent: true
        sap_install_media_detect_igs: false
        sap_install_media_detect_kernel: true
        sap_install_media_detect_webdisp: false
        sap_install_media_detect_db: "ibmdb2"
        sap_install_media_detect_db_client: "ibmdb2"
        sap_install_media_detect_export: "sapecc"

    # 'sap_swpm_cd_ibmdb2_path' is defined in the 'sap_install.sap_install_media_detect' role, not in extravars.
    - name: Ensure rwx permissions for IBM DB2 unpack directory
      ansible.builtin.file:
        path: "{{ sap_swpm_cd_ibmdb2_path }}"
        state: directory
        mode: '0755'
        recurse: true

    - name: Execute Ansible Role sap_swpm
      ansible.builtin.include_role:
        name: community.sap_install.sap_swpm
      vars:
        sap_swpm_templates_product_input: "anydb_ibmdb2"
        sap_swpm_generic: true # tech debt, force override of the SAP NetWeaver install media files detection by sap_swpm itself
        # WARN: This is a override for the Database Load products and should be used with caution.
        # Set to 'true' on clean target hosts (no files are found).
        # Set to 'false' on re-runs (any files were found), causing sap_swpm to fail 100% and protect the DB.
        sap_swpm_db_load_force: >-
          {{
            true
            if (__sap_playbook_register_db2_files_find.files | d([])
             | selectattr('path', 'search', 'sapdata')
             | list
             | length) == 0
            else false
          }}


- name: Ansible Play for SAP NetWeaver Application Server - Primary Application Server (PAS)
  hosts: nwas_pas
  become: true
  any_errors_fatal: true
  max_fail_percentage: 0
  tasks:

    - name: Execute Ansible Role sap_install_media_detect
      ansible.builtin.include_role:
        name: community.sap_install.sap_install_media_detect
      vars:
        sap_install_media_detect_swpm: true
        sap_install_media_detect_hostagent: true
        sap_install_media_detect_igs: true
        sap_install_media_detect_kernel: true
        sap_install_media_detect_webdisp: false
        sap_install_media_detect_db_client: "ibmdb2"
        # Added to avoid unknown error from 'step setDefaults' with error
        # 'An empty package path was returned by the media server' caused by no EXPORT files (aka. EXPORT1)
        sap_install_media_detect_export: "sapecc"

    - name: Execute Ansible Role sap_swpm
      ansible.builtin.include_role:
        name: community.sap_install.sap_swpm
      vars:
        sap_swpm_templates_product_input: "nwas_pas"


